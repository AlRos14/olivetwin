name: CI

# Ejecuta el check `ci` en cada pull request y en los push a main.
# No hay un segundo job: el nombre estable `ci` es el que se configura como
# requerido en la protección de rama (ver docs/contributing.md).
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --prefix frontend

      - name: Validar manifiestos de datos
        run: npm run validate:data --prefix frontend

      - name: Tests unitarios
        run: npm test --prefix frontend

      - name: Compilar
        run: npm run build --prefix frontend

      - name: Configurar Python (pipelines)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipelines/nisar/requirements.txt
            pipelines/analysis/requirements.txt

      - name: Tests del pipeline NISAR
        run: |
          pip install -r pipelines/nisar/requirements.txt
          python -m pytest -q pipelines/nisar/tests

      - name: Tests del pipeline de análisis
        run: |
          pip install -r pipelines/analysis/requirements.txt
          python -m pytest -q pipelines/analysis/tests
