name: CI

# Ejecuta el check `ci` en cada pull request y en los push a main.
# No hay un segundo job: el nombre estable `ci` es el que se configura como
# requerido en la protección de rama (ver docs/contributing.md).
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --prefix frontend

      - name: Validar manifiestos de datos
        run: npm run validate:data --prefix frontend

      - name: Compilar
        run: npm run build --prefix frontend
